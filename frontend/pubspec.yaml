name: life_logger
description: A dark-mode life logging app UI inspired by journaling and travel memories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cupertino_icons: ^1.0.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.1.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
